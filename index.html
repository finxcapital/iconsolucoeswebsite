<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#080b12" />
  <title>Icon Soluções | Em construção</title>
  <meta name="facebook-domain-verification" content="5kptjdeblfvo54zwkya7js360qeyey" />
  <meta name="description" content="O novo site da Icon Soluções está em construção." />

  <style>
    :root {
      --bg: #080b12;
      --bg-soft: #0e1420;
      --text: #f7f9fc;
      --muted: #94a0b8;
      --line: rgba(255,255,255,.08);
      --accent: #6d7cff;
      --accent-2: #39c6ff;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 20%, rgba(109,124,255,.17), transparent 28%),
        radial-gradient(circle at 82% 76%, rgba(57,198,255,.10), transparent 30%),
        var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .38;
      background-image:
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size: 72px 72px;
      mask-image: radial-gradient(circle at center, #000 28%, transparent 78%);
    }

    .glow {
      position: fixed;
      width: 28rem;
      height: 28rem;
      border-radius: 50%;
      filter: blur(100px);
      background: rgba(109,124,255,.13);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    main {
      position: relative;
      z-index: 1;
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 32px 22px;
    }

    .content {
      width: min(760px, 100%);
      text-align: center;
      animation: enter .8s cubic-bezier(.2,.8,.2,1) both;
    }

    .logo-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 13px 20px;
      margin-bottom: 36px;
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 18px;
      background: rgba(255,255,255,.035);
      box-shadow: 0 18px 50px rgba(0,0,0,.22);
      backdrop-filter: blur(12px);
    }

    .logo {
      display: block;
      width: 175px;
      height: auto;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 8px 12px;
      margin-bottom: 22px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.09);
      background: rgba(255,255,255,.045);
      color: #c9d0df;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-2);
      box-shadow: 0 0 0 5px rgba(57,198,255,.09), 0 0 18px rgba(57,198,255,.55);
      animation: pulse 1.8s ease-in-out infinite;
    }

    h1 {
      margin: 0;
      font-size: clamp(42px, 8vw, 82px);
      line-height: .98;
      letter-spacing: -.055em;
      font-weight: 850;
    }

    h1 span {
      background: linear-gradient(100deg, #ffffff 15%, #bdc7ff 56%, #79dbff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    p {
      max-width: 590px;
      margin: 24px auto 0;
      color: var(--muted);
      font-size: clamp(16px, 2.2vw, 19px);
      line-height: 1.7;
    }

    .loader {
      display: flex;
      justify-content: center;
      gap: 7px;
      margin-top: 34px;
    }

    .loader i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(255,255,255,.75);
      animation: bounce 1.2s infinite ease-in-out;
    }

    .loader i:nth-child(2) { animation-delay: .15s; }
    .loader i:nth-child(3) { animation-delay: .30s; }

    footer {
      position: fixed;
      z-index: 2;
      left: 0;
      right: 0;
      bottom: 22px;
      text-align: center;
      color: rgba(255,255,255,.35);
      font-size: 12px;
      letter-spacing: .04em;
    }

    @keyframes enter {
      from { opacity: 0; transform: translateY(18px) scale(.985); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(.72); opacity: .65; }
    }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: .35; }
      40% { transform: translateY(-7px); opacity: 1; }
    }

    @media (max-width: 520px) {
      .logo-wrap { margin-bottom: 28px; }
      .logo { width: 145px; }
      p { line-height: 1.6; }
      footer { bottom: 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>

  <main>
    <section class="content" aria-labelledby="titulo">
      <div class="logo-wrap" aria-label="Icon Soluções">
        <svg class="logo" width="175" height="56" viewBox="0 0 175 56" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ICON">
          <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="white" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="50" font-weight="800" letter-spacing="1">ICON</text>
        </svg>
      </div>

      <div class="badge"><span class="dot"></span> Em desenvolvimento</div>

      <h1 id="titulo">Estamos construindo <span>algo novo.</span></h1>
      <p>
        O novo site da <strong style="color:#e9edf6;font-weight:650">Icon Soluções</strong> está em construção.
        Em breve, uma nova experiência estará no ar.
      </p>

      <div class="loader" aria-label="Carregando">
        <i></i><i></i><i></i>
      </div>
    </section>
  </main>

  <footer>ICON SERVICES PARTICIPACOES LTDA

</body>
</html>
